name: Publicar aplicativo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar antes de publicar
        run: |
          node --check --input-type=module < dist/app.js
          for module in dist/modules/*.js; do
            node --check --input-type=module < "$module"
          done
          node --check dist/csv.js
          node --check dist/analytics.js
          node --check dist/folder-backup.js
          node --check dist/sw.js
          node --test tests/*.test.cjs
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
