name: Verificação do Meu Dinheiro

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check --input-type=module < dist/app.js
          for module in dist/modules/*.js; do
            node --check --input-type=module < "$module"
          done
          node --check dist/csv.js
          node --check dist/analytics.js
          node --check dist/folder-backup.js
          node --check dist/sw.js
      - name: Executar testes
        run: node --test tests/*.test.cjs

      - name: Gerar HTML de homologação
        run: node scripts/gerar-html-teste.cjs meu-dinheiro-roadmap-p0.html
      - name: Disponibilizar HTML de homologação
        uses: actions/upload-artifact@v4
        with:
          name: meu-dinheiro-roadmap-p0
          path: meu-dinheiro-roadmap-p0.html
