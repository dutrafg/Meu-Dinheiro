name: Verificação do Meu Dinheiro

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check dist/app.js
          node --check dist/csv.js
          node --check dist/analytics.js
          node --check dist/sw.js
      - name: Executar testes
        run: node --test tests/*.test.cjs
