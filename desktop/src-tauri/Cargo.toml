[package]
name = "meu-dinheiro-windows"
version = "0.3.0"
description = "Meu Dinheiro para Windows"
authors = ["dutrafg"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
rfd = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
